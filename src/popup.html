<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
<link id="mobile-styles" rel="stylesheet" href="mobile.css" media="not all">
<script src="mobile-ui.js"></script>
<script src="i18n.js"></script>
<style>
  .icon-button {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 8px;
    transition: background-color .14s ease, border-color .14s ease, color .14s ease, transform .14s ease;
    background: transparent !important;
    border-color: transparent !important;
    box-shadow: none !important;
  }
  .icon-button:hover {
    background: #fff2e8 !important;
    border-color: #f5c9aa !important;
    color: #c95708;
    transform: translateY(-1px);
  }
  .icon-button:active {
    background: #ffe3cf !important;
    transform: translateY(0);
  }
  .icon-button:focus-visible {
    outline: 2px solid #e56a16;
    outline-offset: 2px;
    background: #fff2e8 !important;
    color: #c95708;
  }
  @media (prefers-color-scheme: dark) {
    .icon-button { background:transparent !important; border-color:transparent !important; }
    .icon-button:hover, .icon-button:focus-visible { background:#303030 !important; border-color:#555 !important; color:#ffad70; }
    .icon-button:active { background:#3b3b3b !important; }
  }
</style>
<main class="popup-shell">
  <header class="app-header"><div><div class="brand" data-i18n="appName">橙竟是翻译</div><div class="subtitle" data-i18n="popupSubtitle">划词 · 文本 · 沉浸式翻译</div></div><button id="options" class="icon-button" title="设置" data-i18n-title="settings">⚙</button></header>
  <section class="quick-card"><label for="query" data-i18n="quickTranslation">快速翻译</label><textarea id="query" rows="4" placeholder="输入单词、短语或句子…" data-i18n-placeholder="queryPlaceholder"></textarea><div class="quick-actions"><select id="quick-target" data-combobox></select><button id="translate" data-i18n="translate">翻译</button></div><div id="result" class="quick-result" hidden></div></section>
  <section class="action-list"><button id="page" class="action-item"><span>文</span><div><b data-i18n="immersiveTranslation">沉浸式翻译</b><small data-i18n="immersiveActionHelp">翻译当前视口和下方一屏</small></div><i>›</i></button><button id="pdf" class="action-item"><span>PDF</span><div><b data-i18n="manualPdf">手动翻译 PDF</b><small data-i18n="pdfActionHelp">不会自动接管浏览器 PDF</small></div><i>›</i></button></section>
</main>
<script type="module" src="popup.js"></script>
